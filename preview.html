<!DOCTYPE html>
<html>
<head>
    <title>Kick Me Doodle Preview</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #fff; margin: 0 0 8px 0; }
        .subtitle { color: #888; margin: 0 0 30px 0; font-size: 14px; }
        .card {
            background: #222;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        .card h3 {
            color: #fff;
            margin: 0 0 16px 0;
            font-size: 16px;
        }
        #preview {
            width: 500px;
            height: 500px;
            background: #444;
            border-radius: 8px;
        }
        .hint { color: #666; margin-top: 20px; font-size: 13px; }
    </style>
</head>
